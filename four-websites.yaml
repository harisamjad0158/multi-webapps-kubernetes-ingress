apiVersion: v1
kind: Namespace
metadata:
  name: webapps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateless-ecommerce
  namespace: webapps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stateless-ecommerce
  template:
    metadata:
      labels:
        app: stateless-ecommerce
    spec:
      containers:
        - name: ecommerce
          image: stateless-ecommerce:1.0.2
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stateless-ecommerce
  namespace: webapps
spec:
  type: ClusterIP
  selector:
    app: stateless-ecommerce
  ports:
    - port: 80
      targetPort: 8080
---
